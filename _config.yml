# Setup
title: Jeffrey Han
description: MLOps Engineer at TnM Tech
url: https://braveveigar.github.io
avatar: /avatar.jpeg
permalink: pretty
# No cover_image set: the sidebar falls back to the calm warm gradient
# defined in _sass/_sidebar.scss (see .sidebar-gradient).

# Gems
plugins:
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - scripts/
  - not-pure-poole.gemspec

# Optimize Jekyl SEO Tag
twitter:
  username: vszhub
  card: summary
logo: logo.png
social:
  name: Songzi Vong
  links:
    - https://twitter.com/vszhub
    - https://github.com/vszhub
google_site_verification: xxxxx
lang: ko

sass:
  sass_dir: _sass
  style: :compressed

# Options

# Replace this value and uncomment to enable Google Analytics tracking
google_analytics: G-51K3FS6939

# Replace this value and uncomment to enable Disqus
# disqus: xxxxxx

# Specify the author for blog posts
author:
  name: Jeffrey Han
  url: https://github.com/braveveigar/
  email: hang@tnmtech.com
