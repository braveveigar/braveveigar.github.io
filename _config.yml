# Setup
title: Jeffrey Han
description: MLOps Engineer at Scenera
url: https://braveveigar.github.io
avatar: /avatar.jpeg
paginate: 5
permalink: pretty
# No cover_image set: the sidebar falls back to the calm warm gradient
# defined in _sass/_sidebar.scss (see .sidebar-gradient).

# Gems
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Translated copies of posts live in the `translations` collection instead of
# `_posts`, so they render as normal pages (with permalinks) but don't show
# up in the homepage/pagination listing alongside the original-language posts.
# See _includes/language-switcher.html for how a post finds its siblings.
collections:
  translations:
    output: true

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - scripts/
  - not-pure-poole.gemspec

# Optimize Jekyl SEO Tag
twitter:
  username: vszhub
  card: summary
logo: logo.png
social:
  name: Songzi Vong
  links:
    - https://twitter.com/vszhub
    - https://github.com/vszhub
google_site_verification: xxxxx
lang: en

sass:
  sass_dir: _sass
  style: :compressed

# Options

# Replace this value and uncomment to enable Google Analytics tracking
# google_analytics: UA-000000-0

# Replace this value and uncomment to enable Disqus
# disqus: xxxxxx

# Specify the author for blog posts
author:
  name: Jeffrey Han
  url: https://github.com/braveveigar/
  email: gyol.han@scenera.net
